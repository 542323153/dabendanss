<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>年龄确认</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, -apple-system, sans-serif;
        }
        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: url('bg.jpg') center center / cover no-repeat;
        }
        .mask {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.65);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .popup {
            background: #ffffff;
            border-radius: 12px;
            padding: 32px 24px;
            max-width: 420px;
            width: calc(100% - 40px);
            text-align: center;
        }
        .popup h2 {
            font-size: 22px;
            color: #222;
            margin-bottom: 16px;
        }
        .popup p {
            font-size: 15px;
            color: #555;
            line-height: 1.6;
            margin-bottom: 28px;
        }
        .btn-group {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
            justify-content: center;
        }
        button {
            border: none;
            border-radius: 8px;
            padding: 12px 26px;
            font-size: 16px;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:hover {
            opacity: 0.9;
        }
        .btn-yes {
            background-color: #dc3545;
            color: #fff;
        }
        .btn-no {
            background-color: #868e96;
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="mask" id="ageMask">
        <div class="popup">
            <h2>您是否已满18岁</h2>
            <p>以下内容可能不适合未满18岁的人群观看，我们需要确认您的年龄。</p>
            <div class="btn-group">
                <button class="btn-yes" id="btnYes">已满18岁</button>
                <button class="btn-no" id="btnNo">未满18岁</button>
            </div>
        </div>
    </div>

    <script>
        // 读取cookie
        function getCookie(name) {
            const arr = document.cookie.match(new RegExp("(^| )" + name + "=([^;]*)(;|$)"));
            if(arr !== null) return unescape(arr[2]);
            return null;
        }
        // 设置cookie，有效期30天
        function setCookie(name, value, days) {
            const date = new Date();
            date.setTime(date.getTime() + days * 24 * 60 * 60 * 1000);
            document.cookie = name + "=" + escape(value) + ";expires=" + date.toUTCString() + ";path=/";
        }

        const mask = document.getElementById('ageMask');
        const btnYes = document.getElementById('btnYes');
        const btnNo = document.getElementById('btnNo');

        // 已验证则隐藏弹窗
        if(getCookie('ageConfirm') === 'ok'){
            mask.style.display = 'none';
        }

        btnYes.onclick = function(){
            setCookie('ageConfirm','ok',30);
            mask.style.display = 'none';
        }
        btnNo.onclick = function(){
            window.location.href = "https://www.baidu.com";
        }
    </script>
</body>
</html>
